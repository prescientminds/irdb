        end_year: 2001
        is_current: false
        city: "Los Angeles"
        neighborhood: "West Hollywood"
        cuisine_tags: ["french", "california", "fine-dining"]
        restaurant_status: "closed"
        open_year: 1986
        close_year: 2001
        price_range: "$$$$"
        format: "fine-dining"

