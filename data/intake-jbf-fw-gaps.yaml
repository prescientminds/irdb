  # ── 1. Michel Richard ──────────────────────────────────
  # JBF 1992 Best Chef: California. JBF 2007 Outstanding Chef.
  - name: "Michel Richard"
    bio: "French pastry prodigy turned LA fine dining pioneer. Trained under Gaston Lenôtre in Paris, opened Citrus in 1986 which redefined French cooking in LA. Won JBF Best Chef: California 1992 and Outstanding Chef 2007. Later moved to DC. Died 2016."
    birth_country: "FR"
    birth_city: "Pabu, Brittany"
    cuisine_tags: ["french", "pastry", "fine-dining", "california"]
    status: "deceased"
    stops:
