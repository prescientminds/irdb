# IRDB NYC Wave 1 — First batch of New York chefs
# Run: python3 scripts/batch-intake.py data/intake-nyc-wave1.yaml
# Dry: python3 scripts/batch-intake.py data/intake-nyc-wave1.yaml --dry-run --verbose
#
# 27 chefs, ordered so mentors precede protégés within this batch.
# Existing DB chefs (Boulud, Ripert, Keller, Barber, Takayama) can be
# referenced as mentors without needing to appear here.

default_city: "New York"
default_state: "NY"

