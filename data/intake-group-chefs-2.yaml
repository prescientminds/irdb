        mentor: Mark Peel

  - name: Jacob Solomon
    bio: "Executive chef at Orla (Mina Group) at Regent Santa Monica. LA native. Previously corporate chef at Lettuce Entertain You, ran Testaccio in Chicago. Egyptian-Mediterranean focus."
    birth_country: US
    birth_city: "Los Angeles, CA"
    cuisine_tags: [mediterranean, middle-eastern, egyptian, fine-dining]
    stops:
