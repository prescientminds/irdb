  - name: Sean Tan
    bio: "Executive chef at Nobu Los Angeles. Malaysian-born. Came up through the Nobu system — Nobu Melbourne, then EC at Nobu Hotel Chicago. Culinary lead for Australian Open and BNP Paribas Open events."
    birth_country: MY
    cuisine_tags: [japanese, peruvian, sushi, fine-dining]
    stops:
      - restaurant: Nobu Los Angeles
        position: "Executive Chef"
        is_current: true
        mentor: Nobu Matsuhisa

  - name: Hans Rockenwagner
    bio: "German-trained chef with 40-year LA career. Black Forest Academy (classical French/nouvelle), then Michelin 2-star Zum Adler near Basel. Recruited to Le Perroquet in Chicago at 22. Opened Rockenwagner in LA in 1984. JBF Rising Star Chef. Now co-owns Dear John's and Dear Jane's with Josiah Citrin."
    birth_country: DE
    cuisine_tags: [german, french, american, bakery]
    stops:
      - restaurant: "Dear John's"
        position: "Co-Chef/Owner"
        start_year: 2019
        is_current: true

  - name: Brandon Gray
    bio: "Culinary director at Cape Seafood & Provisions. Trained at Providence under Michael Cimarusti, then Trois Mec under Ludo Lefebvre. Two-mentor pedigree. Runs the day-to-day at Cimarusti's seafood market."
    birth_country: US
    cuisine_tags: [seafood, california, sustainable]
