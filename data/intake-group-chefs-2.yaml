  - name: John-Carlos Kuramoto
    bio: "CIA-trained chef running food for the h.wood Group. Apprenticed under Ming Tsai at Blue Ginger, cooked at Michael Mina's Bellagio, Campanile, and was EC at Michael's Santa Monica at 23. Joined h.wood with The Nice Guy opening in 2014."
